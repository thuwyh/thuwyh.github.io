menu:
  main:
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - name: Search
      url: search/
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20

params:
  math: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
